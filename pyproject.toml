[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcs"
version = "0.6.7"
description = "ARCS: Arbitrary Resistive-wall Cross-section Solver with finite-beta Maxwell fields and conductivity-gradient roughness"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7", "shapely>=2,<3"]
cad = ["ezdxf>=1.3,<2"]
notebook = ["jupyterlab>=4,<5", "nbformat>=5", "nbclient>=0.10"]

[project.scripts]
arcs-geometry = "arcs.geometry_cli:main"
arcs-gui = "arcs.gui:main"
arcs-import = "arcs.geometry_import_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
